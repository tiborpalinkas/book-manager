services:
  postgres:
    image: postgres
    container_name: postgres-sql-bsn
    environment:
      POSTGRES_DB: book_social_network
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - 5432:5432
    volumes:
      - postgres:/data/postgres
    networks:
      - spring-demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book-manager"]
      interval: 5s
      timeout: 5s
      retries: 5
  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

volumes:
  postgres:
    driver: local

networks:
  spring-demo:
    driver: bridge