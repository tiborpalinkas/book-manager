<main class="login-page">
  <form class="card login-container shadow-sm" (ngSubmit)="login()">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 text-center mb-2">Bejelentkezés</h1>
      <p class="text-secondary text-center mb-4">Book Manager</p>

      @if (errorMsg.length) {
        <div class="alert alert-danger" role="alert">
          @for (msg of errorMsg; track msg) {
            <p class="mb-0">{{ msg }}</p>
          }
        </div>
      }

      @if (successMsg) {
        <div class="alert alert-success" role="status">{{ successMsg }}</div>
      }

      <div class="mb-3">
        <label for="login" class="form-label">E-mail-cím</label>
        <input [(ngModel)]="authRequest.email" type="email" class="form-control" id="login"
               name="email" placeholder="nev@pelda.hu" autocomplete="email" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Jelszó</label>
        <input [(ngModel)]="authRequest.password" type="password" class="form-control" id="password"
               name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
        @if (isSubmitting) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Bejelentkezés…
        } @else {
          <i class="fas fa-sign-in-alt me-2" aria-hidden="true"></i>
          Bejelentkezés
        }
      </button>

      <div class="text-center mt-4">
        <span>Nincs még fiókod?</span>
        <button (click)="register()" type="button" class="btn btn-link p-1">Regisztráció</button>
      </div>
    </div>
  </form>
</main>
